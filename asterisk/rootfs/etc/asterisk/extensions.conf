; Note: this file has been modified from the Asterisk defaults for the add-on

[general]
static=yes

[default]
include => parkedcalls
;
exten => 444,1,Park(,s)
;
exten => 555,1,ParkedCall(default,701)
exten => _X!,1,Set(DIAL_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
same => n,GotoIf($[${ISNULL(${DIAL_CONTACTS})}]?dial_endpoint:dial_contacts)
same => n(dial_contacts),Dial(${DIAL_CONTACTS},30)
same => n,Hangup()
same => n(dial_endpoint),Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

; Dynamic Web UI endpoint management routes
exten => save_device,1,NoOp(Save device via Web UI: ${FILTER(A-Za-z0-9_-,${EXT})})
same => n,System(python3 /usr/local/bin/save_device.py "${FILTER(A-Za-z0-9_-,${EXT})}" "${FILTER(A-Za-z0-9 _.-,${NAME})}" "${FILTER(A-Za-z0-9!@#%^&*_=+.-,${SECRET})}" "${FILTER(a-z,${TYPE})}" "${FILTER(a-z0-9_,${CODECS})}" "${FILTER(a-z0-9-,${TRANSPORT})}")
same => n,Hangup()

exten => delete_device,1,NoOp(Delete device via Web UI: ${FILTER(A-Za-z0-9_-,${EXT})})
same => n,System(python3 /usr/local/bin/save_device.py --delete "${FILTER(A-Za-z0-9_-,${EXT})}")
same => n,Hangup()

[parkedcallstimeout]
exten => s,1,Hangup()
